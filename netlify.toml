# Netlify, as an alternative to Vercel (web/vercel.json). Either is fine; pick
# one and ignore the other. This one lives at the repo root because Netlify
# reads its config from there and then changes into `base`.
#
# See docs/hosting.md for the walkthrough.

[build]
  base = "web"
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

# Single page app: every path serves index.html so React Router can handle it.
# Without this, a tester who refreshes on /account, or follows a link straight
# to it, gets a 404 from Netlify before the app ever loads. Netlify serves real
# files first, so /walkthrough.html and the built assets are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never come from cache. If it does, a coach who has
# installed the app to their home screen keeps running an old build after a
# deploy with no way to force an update.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Asset filenames carry a content hash, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
